    function saveAppState() {
        try {
            localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(appState));
        } catch(e) {
            console.error("Storage error:", e);
        }
    }

    function loadAppState() {
        try {
            const saved = localStorage.getItem(APP_STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed) {
                    appState = Object.assign({}, appState, parsed);
                }
            } else {
                saveAppState();
            }
        } catch(e) {
            console.error("Error loading app state:", e);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const startupTasks = [
            ['loadAppState', loadAppState],

            ['renderGallery', () => renderGallery('lola')],

    function initCountdown() {
        const startDate = new Date('2026-04-08T00:00:00');
        setInterval(() => {
            const now = new Date();
            const diff = now - startDate;
            if (diff < 0) return;

            const dEl = document.getElementById('daysCount');
            const hEl = document.getElementById('hoursCount');
            const mEl = document.getElementById('minsCount');
            const sEl = document.getElementById('secsCount');

            if (dEl) dEl.textContent = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
            if (hEl) hEl.textContent = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
            if (mEl) mEl.textContent = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
            if (sEl) sEl.textContent = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
        }, 1000);
    }

    function initLoveMessages() {
        const display = document.getElementById('loveMsgDisplay');
        if (!display) return;
        const idx = appState.loveMsgIndex || 0;
        display.textContent = `"${loveReasonsArray[idx]}"`;

    function nextLoveMessage() {
        const display = document.getElementById('loveMsgDisplay');

    function initTodoList() {
        renderTodoList();
        initTodoSync();
    
        const todoInput = document.getElementById('todoInput');
        if (todoInput) {
            todoInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();

                }

    function renderTodoList() {
        const container = document.getElementById('todoListContainer');
        if (!container) return;

        if (!appState.todos || appState.todos.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: #9ca3af; font-size: 0.9rem; padding: 1rem;">No tasks yet. Add something sweet above! ❤️</p>`;
            return;
        }

        container.innerHTML = '';
        appState.todos.forEach((item) => {
            container.innerHTML += `
                <div class="todo-item ${item.completed ? 'completed' : ''}">
                    <div class="todo-item-content" onclick="toggleTodoItem(${item.id})">
                        <input type="checkbox" ${item.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTodoItem(${item.id})">
                        <span style="font-size: 0.95rem; color: #f3f4f6;">${escapeHtml(item.text)}</span>
                    </div>
                    <button class="todo-delete-btn" onclick="deleteTodoItem(${item.id})" aria-label="Delete task">×</button>
                </div>
            `;
        });
        updateLeithDailySummary();
    }

    function addTodoItem() {
        const input = document.getElementById('todoInput');
        if (!input) return;
        const text = input.value.trim();
        if (!text) return;

        const newItem = {
            id: Date.now(),
            text: text,
            completed: false
        };

        appState.todos.unshift(newItem);
        input.value = '';
        saveAppState();
        renderTodoList();
        pushTodoStateToSupabase();
    }

    function handleTodoKeypress(e) {
        if (e.key === 'Enter') {
            addTodoItem();
        }
    }

    function toggleTodoItem(id) {
        const item = appState.todos.find(t => t.id === id);
        if (item) {
            item.completed = !item.completed;
            saveAppState();
            renderTodoList();
            pushTodoStateToSupabase();
        }
    }

    function deleteTodoItem(id) {
        appState.todos = appState.todos.filter(t => t.id !== id);
        saveAppState();
        renderTodoList();
        pushTodoStateToSupabase();
    }

        return (str || '').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");

    let activeFolder = 'lola';

    function renderGallery(folderKey) {
        activeFolder = folderKey;
        const grid = document.getElementById('photoGrid');
        if (!grid) return;

        document.querySelectorAll('.gallery-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
        if (typeof event !== 'undefined' && event && event.target && event.target.classList) {
            event.target.classList.add('active');
        }

        const photos = foldersData[folderKey] || [];
        grid.innerHTML = '';

        photos.forEach((photo, idx) => {
            grid.innerHTML += `
                <div class="photo-card" onclick="openLightbox(${idx})">
                    <div class="photo-img-wrapper">
                        <img src="${photo.file}" alt="${photo.title}" loading="lazy" onerror="this.src='https://placehold.co/600x400/1e1b2e/ff6584?text=Photo';">

    function filterGallery(folderKey, eventObj) {
        activeFolder = folderKey;
        const grid = document.getElementById('photoGrid');

        document.querySelectorAll('.gallery-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
        if (eventObj && eventObj.target && eventObj.target.classList) {
            eventObj.target.classList.add('active');
        }

        const photos = foldersData[folderKey] || [];
        grid.innerHTML = '';

        photos.forEach((photo, idx) => {
            grid.innerHTML += `
                <div class="photo-card" onclick="openLightbox(${idx})">

        document.getElementById('lightboxModal').classList.remove('active');

        document.getElementById('lightboxImg').src = photo.file;

    const TIME_MESSAGE_TABLE = 'time_message_state';
    let timeMessageSupabaseClient = null;
    let timeMessageLastUpdatedAt = null;
    let timeMessageApplyingRemote = false;
    let timeMessageUnlockTimer = null;
    let timeMessageLastNotifiedId = null;

    function ensureTimeMessageState() {
        if (!appState.timeMessage || typeof appState.timeMessage !== 'object') {
            appState.timeMessage = { message:"", openDate:"", openTime:"", id:null, history:[], recurring:false, replies:[] };
        }
        if (!Array.isArray(appState.timeMessage.history)) appState.timeMessage.history = [];
        if (!Array.isArray(appState.timeMessage.replies)) appState.timeMessage.replies = [];
        if (typeof appState.timeMessage.recurring !== 'boolean') appState.timeMessage.recurring = false;
        return appState.timeMessage;
    }

    function getTimeMessageId() {
        const tm = ensureTimeMessageState();
        return tm.id || `${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    }

    function formatTimeMessageDate(dateStr, timeStr) {
        try {
            return new Date(`${dateStr}T${timeStr || '00:00'}:00`).toLocaleString('ar-EG', {
                dateStyle:'medium', timeStyle:'short'
            });
        } catch(e) { return `${dateStr || ''} ${timeStr || ''}`; }
    }

    function isTimeMessageUnlocked(tm) {
        if (!tm || !tm.message || !tm.openDate) return false;
        const target = new Date(`${tm.openDate}T${tm.openTime || '00:00'}:00`);
        return !Number.isNaN(target.getTime()) && new Date() >= target;
    }

    function showTimeMessageToast(message) {
        const toast = document.getElementById('timeMessageToast');
        const txt = document.getElementById('timeMessageToastText');
        if (!toast || !txt) return;
        txt.textContent = message;
        toast.classList.add('active');
        setTimeout(() => toast.classList.remove('active'), 9000);
    }

    async function requestTimeMessageNotifications() {
        if (!('Notification' in window)) {
            showTimeMessageToast('المتصفح ده مش بيدعم إشعارات النظام، لكن إشعار الموقع الداخلي شغال ❤️');
            return;
        }
        try {
            const permission = await Notification.requestPermission();
            updateTimeMessageNotificationStatus(permission);
            if (permission === 'granted') {
                new Notification('💌 Time Message', { body:'الإشعارات اتفعلت. هقولك لما رسالة وقتها ييجي ❤️' });
            }
        } catch(e) {
            console.warn('Notification permission error:', e);
        }
    }

    function updateTimeMessageNotificationStatus(permission) {
        const box = document.getElementById('timeMessageNotifyStatus');
        if (!box) return;
        if (permission === 'granted') {
            box.style.display = 'flex';
            box.innerHTML = '<span>🔔 الإشعارات مفعلة</span><span>جاهزين 💗</span>';
        } else if (permission === 'denied') {
            box.style.display = 'flex';
            box.innerHTML = '<span>🔕 الإشعارات مرفوضة من المتصفح</span><span>الإشعار داخل الصفحة شغال</span>';
        } else {
            box.style.display = 'flex';
            box.innerHTML = '<span>🔔 الإشعارات غير مفعلة</span><span>اضغط تفعيل</span>';
        }
    }

    function notifyTimeMessageUnlocked(tm) {
        if (!tm) return;
        const id = tm.id || `${tm.openDate}|${tm.openTime}|${tm.message}`;
        const seenKey = 'jojo_lola_tm_notified_' + id;
        if (localStorage.getItem(seenKey) === '1') return;
        localStorage.setItem(seenKey, '1');
        timeMessageLastNotifiedId = id;

        showTimeMessageToast(`رسالة مؤجلة فتحت ❤️: ${tm.message}`);

        if ('Notification' in window && Notification.permission === 'granted') {
            try { new Notification('💌 رسالة وقتها جه', { body: tm.message }); } catch(e) {}
        }

        try {
            if (document.visibilityState === 'visible' && window.__tmAudioUnlocked) {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.value = 880;
                gain.gain.value = 0.045;
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.16);
            }
        } catch(e) {}
    }

    function checkTimeMessageUnlock() {
        ensureTimeMessageState();
        const tm = appState.timeMessage;
        if (tm.message && tm.openDate && isTimeMessageUnlocked(tm)) {
            notifyTimeMessageUnlocked(tm);
            renderTimeMessageSection();
        }
    }

    function renderTimeMessageSection() {
        const formContainer = document.getElementById('timeMessageFormContainer');
        const viewContainer = document.getElementById('timeMessageViewContainer');
        if (!formContainer || !viewContainer) return;

        const tm = ensureTimeMessageState();
        if (!tm.message || !tm.openDate) {
            formContainer.style.display = 'flex';
            viewContainer.style.display = 'none';
            return;
        }

        const isUnlocked = isTimeMessageUnlocked(tm);
        formContainer.style.display = 'none';
        viewContainer.style.display = 'flex';

        if (isUnlocked) {
            viewContainer.innerHTML = `
                <span class="ticket-type-badge">💌 Time Message Unlocked</span>
                <div style="font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:#fff;font-weight:600;line-height:1.5;">
                    "${escapeHtml(tm.message)}"
                </div>
                <div style="color:#9ca3af;font-size:.85rem;display:flex;gap:1.5rem;margin-top:.5rem;flex-wrap:wrap;">
                    <span>📅 ${escapeHtml(tm.openDate)}</span>
                    <span>⏰ ${escapeHtml(tm.openTime || '00:00')}</span>
                </div>
                <div class="time-msg-reply">
                    <input id="timeMessageReplyInput" class="time-msg-input" placeholder="اكتب ردك ❤️">
                    <button class="btn-sm-action" onclick="replyToTimeMessage()">رد</button>
                </div>
                <div style="margin-top:.6rem;color:#d1d5db;font-size:.76rem;">
                    ${renderTimeMessageReplies(tm.id)}
                </div>
                <div class="time-msg-tools">
                    <button class="btn-sm-action" onclick="editTimeMessage()">✏️ تعديل</button>
                    <button class="btn-sm-action" onclick="archiveCurrentTimeMessage()">🗃️ أرشفة</button>
                </div>
            `;
        } else {
            viewContainer.innerHTML = `
                <span class="ticket-type-badge">🔒 رسالة مؤجلة</span>
                <div style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:#fff;font-weight:600;">
                    "في رسالة مستنياكي... ❤️"
                </div>
                <div style="color:#ff6584;font-size:.9rem;margin-top:.5rem;">
                    تفتح في: ${escapeHtml(tm.openDate)} عند الساعة ${escapeHtml(tm.openTime || '00:00')}
                </div>
                ${tm.recurring ? '<div style="color:#fbbf24;font-size:.75rem;margin-top:.45rem;">🔁 بتتكرر سنويًا</div>' : ''}
                <button class="btn-sm-action" style="margin-top:1rem;" onclick="editTimeMessage()">✏️ تعديل</button>
            `;
        }
    }

    function saveTimeMessage() {
        ensureTimeMessageState();
        const textEl = document.getElementById('inputTimeMsgText');
        const dateEl = document.getElementById('inputTimeMsgDate');
        const timeEl = document.getElementById('inputTimeMsgTime');
        const text = textEl?.value.trim() || '';
        const date = dateEl?.value.trim() || '';
        const time = timeEl?.value.trim() || '00:00';
        if (!text || !date) return;

        const old = appState.timeMessage;
        const id = old.id || getTimeMessageId();
        const newMessage = {
            id, message:text, openDate:date, openTime:time,
            recurring: !!old.recurring, replies: Array.isArray(old.replies) ? old.replies : [],
            createdAt: old.createdAt || new Date().toISOString()
        };

        if (old.message && old.openDate) {
            appState.timeMessage.history.push({
                id: old.id || getTimeMessageId(),
                message: old.message, openDate: old.openDate, openTime: old.openTime || '00:00',
                recurring: !!old.recurring, replies: old.replies || [],
                archivedAt: new Date().toISOString()
            });
            if (appState.timeMessage.history.length > 50) appState.timeMessage.history = appState.timeMessage.history.slice(-50);
        }

        appState.timeMessage = newMessage;
        saveAppState();
        renderTimeMessageSection();
        pushTimeMessageStateToSupabase();
    }

    function editTimeMessage() {
        const tm = ensureTimeMessageState();
        const formContainer = document.getElementById('timeMessageFormContainer');
        const viewContainer = document.getElementById('timeMessageViewContainer');
        if (!formContainer || !viewContainer) return;
        document.getElementById('inputTimeMsgText').value = tm.message || "";
        document.getElementById('inputTimeMsgDate').value = tm.openDate || "";
        document.getElementById('inputTimeMsgTime').value = tm.openTime || "";
        formContainer.style.display = 'flex';
        viewContainer.style.display = 'none';
    }

    function archiveCurrentTimeMessage() {
        const tm = ensureTimeMessageState();
        if (!tm.message || !tm.openDate) return;
        tm.history.push({
            id: tm.id || getTimeMessageId(), message:tm.message, openDate:tm.openDate,
            openTime:tm.openTime || '00:00', recurring:!!tm.recurring, replies:tm.replies || [],
            archivedAt:new Date().toISOString()
        });
        tm.history = tm.history.slice(-50);
        appState.timeMessage = { message:"", openDate:"", openTime:"", id:null, history:tm.history, recurring:false, replies:[] };
        saveAppState();
        renderTimeMessageSection();
        renderTimeMessageArchive();
        pushTimeMessageStateToSupabase();
    }

    function openTimeMessageArchive() {
        const box = document.getElementById('timeMessageArchive');
        if (!box) return;
        box.style.display = box.style.display === 'none' ? 'flex' : 'none';
        if (box.style.display !== 'none') renderTimeMessageArchive();
    }

    function renderTimeMessageArchive() {
        const box = document.getElementById('timeMessageArchive');
        if (!box) return;
        const history = ensureTimeMessageState().history.slice().reverse();
        if (!history.length) {
            box.innerHTML = '<div style="color:#9ca3af;font-size:.75rem;text-align:center;">الأرشيف لسه فاضي ❤️</div>';
            return;
        }
        box.innerHTML = history.map((item, idx) => `
            <div class="time-msg-history-item">
                <div class="tmh-main">
                    <div class="tmh-title">${escapeHtml(item.message || '')}</div>
                    <div class="tmh-meta">${escapeHtml(formatTimeMessageDate(item.openDate,item.openTime))}${item.recurring ? ' • 🔁 سنوي' : ''}</div>
                </div>
                <div class="tmh-actions">
                    <button class="btn-sm-action" onclick="restoreTimeMessageFromArchive(${history.length-1-idx})">↩️ استرجاع</button>
                    <button class="btn-sm-action" onclick="deleteTimeMessageArchive(${history.length-1-idx})">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    function restoreTimeMessageFromArchive(index) {
        const tm = ensureTimeMessageState();
        const item = tm.history[index];
        if (!item) return;
        appState.timeMessage = {
            id:item.id || getTimeMessageId(), message:item.message || '',
            openDate:item.openDate || '', openTime:item.openTime || '00:00',

            if (!timeMessageSupabaseClient) return;
            fetchTimeMessageStateFromSupabase();

                        { event:'*', schema:'public', table:TIME_MESSAGE_TABLE, filter:'id=eq.1' },

    async function fetchTimeMessageStateFromSupabase() {

                .from(TIME_MESSAGE_TABLE).select('id,state,updated_at').eq('id',1).maybeSingle();
            if (error) {

    function applyRemoteTimeMessageState(row) {
        if (!row || !row.state) return;
        if (timeMessageLastUpdatedAt && row.updated_at &&
            new Date(row.updated_at).getTime() <= new Date(timeMessageLastUpdatedAt).getTime()) return;
        timeMessageLastUpdatedAt = row.updated_at || timeMessageLastUpdatedAt;
        timeMessageApplyingRemote = true;
        const remote = typeof row.state === 'string' ? JSON.parse(row.state) : row.state;
        appState.timeMessage = Object.assign({
            message:"",openDate:"",openTime:"",id:null,history:[],recurring:false,replies:[]
        }, remote || {});
        ensureTimeMessageState();
        saveAppState();
        renderTimeMessageSection();
        renderTimeMessageArchive();
        timeMessageApplyingRemote = false;
    }

    async function pushTimeMessageStateToSupabase() {
        if (!timeMessageSupabaseClient || timeMessageApplyingRemote) return;
        try {
            const nowIso = new Date().toISOString();
            const stateSnapshot = JSON.parse(JSON.stringify(ensureTimeMessageState()));
            timeMessageLastUpdatedAt = nowIso;
            const {error} = await timeMessageSupabaseClient.from(TIME_MESSAGE_TABLE).upsert({
                id:1,
                state:stateSnapshot,
                updated_at:nowIso
            });
            if (error) {}
        } catch(e) {}
    }

        recordLeithMoodHistory(moodKey);

        appState.leith.latestMessage = randomResp;
        appState.leith.sender = 'jojo';
        appState.leith.isPersistentMsg = true;

        if (save) saveAppState();

        applyLeithMoodUI(moodKey);
        showLeithMessage(randomResp, 'jojo');
        updateLeithStreak();
        pushLeithStateToSupabase();
    }

    function recordLeithMoodHistory(moodKey) {
        if (!appState.leith.moodHistory) appState.leith.moodHistory = [];
        appState.leith.moodHistory.push({ mood: moodKey, date: new Date().toISOString() });
        if (appState.leith.moodHistory.length > 30) {
            appState.leith.moodHistory = appState.leith.moodHistory.slice(-30);
        }
    }

    function checkLeithMoodPattern(moodKey) {
        if (moodKey === 'neutral' || moodKey === 'happy' || moodKey === 'love') return null;
        const history = appState.leith.moodHistory || [];
        const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
        const recentSame = history.filter(h => h.mood === moodKey && new Date(h.date).getTime() >= weekAgo);
        if (recentSame.length >= 2) {
            const patternMsgs = {
                tired: "لاحظت إنك تعبانة كتير الأسبوع ده، خدي بالك من نفسك يا لولا ❤️",
                stressed: "إنتِ مخنوقة كتير الأيام دي... كلمي جوجو، متفضليش لوحدك ❤️",
                sad: "حاسس إنك زعلانة كتير الفترة دي، إحنا هنا نسمعك ❤️",
                bored: "شكلك زهقانة الأسبوع ده كله، يلا نعمل حاجة مختلفة 👀",
                angry: "لاحظت إنك بتعصبي كتير الأيام دي، احكيلي إيه اللي مضايقك ❤️"
            };
            return patternMsgs[moodKey] || null;
        }
        return null;
    }

    function sendLeithReaction(emoji) {
        const currentSender = appState.leith.sender || 'jojo';
        appState.leith.latestMessage = emoji;
        appState.leith.sender = currentSender;
        appState.leith.isPersistentMsg = true;
        saveAppState();
        showLeithMessage(emoji, currentSender);
        updateLeithStreak();
        pushLeithStateToSupabase();
    }

    function applyLeithMoodUI(moodKey) {
        const def = leithMoodDefinitions[moodKey] || leithMoodDefinitions['neutral'];
        const head = document.getElementById('leithChatHead');
        if (head) {
            head.className = `leith-chat-head ${def.ringClass}`;
        }

        const headEmoji = document.getElementById('leithHeadEmoji');
        if (headEmoji) headEmoji.textContent = def.emoji;

        const title = document.getElementById('leithMoodIndicatorTitle');
        if (title) title.textContent = `🦁 Leith (${def.name})`;
    }

    function setLeithSender(sender) {
        appState.leith.sender = sender;
        saveAppState();

        const btnJojo = document.getElementById('senderBtnJojo');
        const btnLola = document.getElementById('senderBtnLola');
        if (btnJojo && btnLola) {
            if (sender === 'jojo') {
                btnJojo.classList.add('active');
                btnLola.classList.remove('active');
            } else {
                btnLola.classList.add('active');
                btnJojo.classList.remove('active');
            }
        }
        const senderDisplay = document.getElementById('leithSenderDisplay');
        if (senderDisplay) {
            senderDisplay.textContent = sender === 'jojo' ? '❤️ جوجو' : '🤍 لولا';
        }
    }

    function showLeithMessage(msg, sender = 'jojo') {
        const textEl = document.getElementById('leithMessageText');
        const senderDisplay = document.getElementById('leithSenderDisplay');
        const dot = document.getElementById('leithUnreadDot');

        if (textEl) textEl.textContent = msg;
        if (senderDisplay) {
            senderDisplay.textContent = sender === 'jojo' ? '❤️ جوجو' : '🤍 لولا';
        }
        if (dot) dot.classList.add('active');

        setLeithSender(sender);
    }

    function checkLeithContextualMessage() {
        if (appState.leith.isPersistentMsg && appState.leith.latestMessage) {
            showLeithMessage(appState.leith.latestMessage, appState.leith.sender || 'jojo');
            return;
        }

        const hour = new Date().getHours();
        let timeMsg = "أهلاً يا لولا 🦁❤️ إزيك النهارده؟";
        if (hour >= 5 && hour < 12) {
            timeMsg = "صباح الخير يا آلاء ❤️ يلا نبدأ اليوم بهدوء";
        } else if (hour >= 12 && hour < 17) {
            timeMsg = "يومك ماشي إزاي؟ عملتي إيه لحد دلوقتي؟ 👀";
        } else if (hour >= 17 && hour < 22) {
            timeMsg = "مساء الخير يا آلاء ❤️ شوفي إيه اللي لسه ناقصك.";
        } else {
            timeMsg = "قبل ما تنامي، متنسيش وردك 🤍 نامي بدري يا لولا.";
        }

        showLeithMessage(timeMsg, 'jojo');
    }

    function triggerLeithSurprise() {
        const surprises = [
            "وحشتيني ❤️",
            "قومي اعملي حاجة حلوة النهارده 👀",
            "جوجو بيحبك 😂❤️",
            "أجمل صدفة في عمري ❤️",
            "ركزي في مستقبلك عشان تبقي دكتورة قد الدنيا 💊❤️"
        ];
        const pick = surprises[Math.floor(Math.random() * surprises.length)];
        appState.leith.latestMessage = pick;
        appState.leith.sender = 'jojo';
        appState.leith.isPersistentMsg = true;
        saveAppState();
        showLeithMessage(pick, 'jojo');
        updateLeithStreak();
        pushLeithStateToSupabase();
    }

    function handleLeithKeypress(e) {
        if (e.key === 'Enter') {
            sendLeithMessage();
        }
    }

    function sendLeithMessage() {
        const input = document.getElementById('leithUserInput');
        if (!input) return;
        const txt = input.value.trim();
        if (!txt) return;

        const currentSender = appState.leith.sender || 'jojo';

        appState.leith.latestMessage = txt;
        appState.leith.sender = currentSender;
        appState.leith.isPersistentMsg = true;
        if (!Array.isArray(appState.leith.messageHistory)) appState.leith.messageHistory = [];
        appState.leith.messageHistory.push({
            text: txt,
            sender: currentSender,
            date: new Date().toISOString()
        });
        if (appState.leith.messageHistory.length > 20) {
            appState.leith.messageHistory = appState.leith.messageHistory.slice(-20);
        }
        saveAppState();

        input.value = '';
        showLeithMessage(txt, currentSender);
        updateLeithStreak();
        pushLeithStateToSupabase();
    }

    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => {
            if (m.id !== 'surpriseModal') {
                m.classList.remove('active');
            }
        });
    }

    function openSurprise() { document.getElementById('surpriseModal').classList.add('active'); }
    function closeSurprise() { document.getElementById('surpriseModal').classList.remove('active'); }

    function createFloatingHearts() {
        const container = document.getElementById('heartsContainer');
        if (!container) return;
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerText = '♥';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 1 + 1) + 'rem';
            const duration = Math.random() * 5 + 5;
            heart.style.animationDuration = duration + 's';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }, 1000);
    }
</script>
